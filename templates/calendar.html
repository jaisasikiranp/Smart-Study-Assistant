<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Calendar | Study Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='calendar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='voice_assistant.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="display: flex;">
    <aside class="sidebar">
        <div class="logo">
            <span style="font-size: 2rem;">🎓</span>
            <div>
                <p style="font-weight: 800; font-size: 1.25rem;">Study</p>
                <p style="font-weight: 800; font-size: 1.25rem; margin-top: -0.25rem;">Assistant</p>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="{{ url_for('dashboard.dashboard_view') }}"><span>⊞</span> Dashboard</a></li>
            <li><a href="{{ url_for('tasks.list_tasks') }}"><span>📋</span> Tasks</a></li>
            <li><a href="{{ url_for('notes.list_notes') }}"><span>🗒️</span> Notes</a></li>
            <li><a href="{{ url_for('resources.list_resources') }}"><span>📚</span> Resources</a></li>
            <li><a href="{{ url_for('courses.manager_view') }}"><span>📖</span> Courses</a></li>
            <li><a href="{{ url_for('calendar.calendar_view') }}" class="active"><span>📅</span> Calendar</a></li>
        </ul>
        <div class="logout">
            <a href="{{ url_for('auth.logout') }}" style="color: #94a3b8; font-weight: 600; text-decoration: none; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 1rem;"><span>🚪</span> Logout</a>
        </div>
    </aside>

    <main class="main-dashboard">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <div>
                <h1 id="monthDisplay" style="font-size: 1.75rem; font-weight: 800; margin: 0;">Month Year</h1>
                <p style="color: var(--text-dim); font-size: 0.9rem;">Plan your study milestones ahead.</p>
            </div>
            <div style="display: flex; gap: 1rem;">
                <button id="prevMonth" class="btn-sm">◀ Prev</button>
                <button id="nextMonth" class="btn-sm">Next ▶</button>
            </div>
        </header>

        <section class="calendar-container">
            <div class="calendar-grid-header">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <div id="calendarGrid" class="calendar-grid">
                <!-- Days will be generated by JS -->
            </div>
        </section>
    </main>

    <!-- Side Panel / Modal for Day View -->
    <div id="dayPanel" class="day-view-overlay" style="display: none;">
        <div class="day-view-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h2 id="selectedDateHeader" style="font-weight: 800;">March 31, 2026</h2>
                    <p style="color: var(--text-dim);">Daily Agenda</p>
                </div>
                <button onclick="closeDayPanel()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
            </header>

            <div id="eventList" class="day-event-list">
                <!-- Events load here -->
            </div>

            <hr style="border: 0; border-top: 1px solid #f1f5f9; margin: 2rem 0;">

            <h3>+ Add New Event</h3>
            <form id="addEventForm" style="margin-top: 1rem;">
                <div class="form-group">
                    <label>Event Title</label>
                    <input type="text" id="eventTitle" required placeholder="e.g., Coding Marathon" style="width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; margin-bottom: 1rem;">
                </div>
                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                    <div style="flex: 1;">
                        <label>Start Time</label>
                        <input type="time" id="startTime" required style="width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.5rem;">
                    </div>
                    <div style="flex: 1;">
                        <label>End Time</label>
                        <input type="time" id="endTime" required style="width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.5rem;">
                    </div>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Save Event</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='nav_highlighter.js') }}"></script>
    <script src="{{ url_for('static', filename='notifications.js') }}"></script>
    <script src="{{ url_for('static', filename='calendar.js') }}"></script>
    <script src="{{ url_for('static', filename='voice_assistant.js') }}"></script>
</body>
</html>
