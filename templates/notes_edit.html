<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Note | Smart Study Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='notes.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="display: flex;">
    <aside class="sidebar">
        <div class="logo">
            <span style="font-size: 2rem;">🎓</span>
            <div>
                <p style="font-weight: 800; font-size: 1.25rem;">Study</p>
                <p style="font-weight: 800; font-size: 1.25rem; margin-top: -0.25rem;">Assistant</p>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="{{ url_for('dashboard.dashboard_view') }}"><span>⊞</span> Dashboard</a></li>
            <li><a href="{{ url_for('tasks.list_tasks') }}"><span>📋</span> Tasks</a></li>
            <li><a href="{{ url_for('notes.list_notes') }}" class="active"><span>🗒️</span> Notes</a></li>
            <li><a href="{{ url_for('resources.list_resources') }}"><span>📚</span> Resources</a></li>
            <li><a href="{{ url_for('courses.manager_view') }}"><span>📖</span> Courses</a></li>
            <li><a href="{{ url_for('calendar.calendar_view') }}"><span>📅</span> Calendar</a></li>
        </ul>
        <div class="logout">
            <a href="{{ url_for('auth.logout') }}" style="color: #cbd5e1; font-weight: 600; text-decoration: none; padding: 0.75rem 1rem;"><span>🚀</span> Logout</a>
        </div>
    </aside>

    <main class="main-dashboard">
        <header class="notes-header">
            <div>
                <h1>Edit Study Note</h1>
                <p style="color: var(--text-dim);">Refine your knowledge repository.</p>
            </div>
            <a href="{{ url_for('notes.list_notes') }}" class="btn" style="width: auto; padding: 0.75rem 1.5rem; margin-top:0; text-decoration: none;">&larr; Back to Library</a>
        </header>

        <section class="card" style="max-width: 800px; margin: 0 auto; padding: 3rem;">
            <form action="{{ url_for('notes.update_note', id=note.id) }}" method="POST">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" name="title" id="title" required value="{{ note.title }}" placeholder="e.g., Python Generators">
                </div>
                <div class="form-group">
                    <label for="content">Content</label>
                    <textarea name="content" id="content" required rows="10" 
                        style="width: 100%; background: white; border: 1.5px solid #e2e8f0; border-radius: 0.75rem; color: #1e293b; padding: 1.5rem; font-family: inherit; resize: vertical; margin-bottom: 2rem;">{{ note.content }}</textarea>
                </div>
                <button type="submit" class="btn">Update Knowledge</button>
            </form>
        </section>
    </main>
</body>
</html>
